name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK if working
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'neobackup-fork' }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'android' }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret found - generating a temporary key"
            keytool -genkeypair -v \
              -keystore signing.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Neo Backup Fork, OU=CI, O=Fork, C=US"
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          APK_IN=$(find build/outputs/apk/release -name '*.apk' | head -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "NeoBackup_${GITHUB_REF_NAME}.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "NeoBackup_${GITHUB_REF_NAME}.apk" | head -2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NeoBackup_${{ github.ref_name }}.apk
          body: |
            ## Neo Backup (fork) — Search in Backup Notes

            This fork extends the app's search feature to cover **backup notes**, so you can quickly find and restore a specific backup among dozens.

            ### What's new
            - The main search bar also matches the **note of each backup** (per-backup notes), not just app name/label.
            - **App page**: when opened while a note search is active, the backups list only shows the backups whose note matches the search (e.g. searching `ABC` and opening the app shows only the backups noted `ABC`). If no backup note matches, all backups are shown as usual.
            - **Restore page**: in the batch restore list, each app's backup list is filtered the same way, so you can directly pick the matching backup to restore.
            - Search still matches package name, app label, app-level note and tags, as before.

            ### Install notes
            - This APK is signed with the fork's own key. It **replaces** an official Neo Backup installation (uninstall the official one first — your backups on storage stay intact, just re-select the backup directory afterwards).
            - Requires Android 8.0+ (API 26+).
            - Root or Shizuku is required for backup/restore operations, same as the official app.

            Built from upstream [NeoApplications/Neo-Backup](https://github.com/NeoApplications/Neo-Backup) with a minimal patch to the search in `FilterUtils`, `AppPage` and the restore list.
